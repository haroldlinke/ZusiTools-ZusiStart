<!DOCTYPE html>
<html lang="de" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../../../../_Setup/timetable_basics/timetable_styles.css" rel="stylesheet" type="text/css" />
    <title>Info-Seite existiert nicht</title>
</head>
<body>
    <header class="epoche%EPOCHE%">
        <div class="headertext">
            <strong>Epoche %EPOCHE_R%</strong>
        </div>
    </header>
    <main>
        <img src="_default-image" />

        <div class="div_fahrplan_datum">
            <span class="fahrplan_datum_header">Fahrplan für</span>
            <br />
            <span class="fahrplan_datum_text">%DATE%</span>
        </div>

        <div class="authortext" style="margin-top: 0px;">
            Fahrplanautor%AUTHOR_PLURAL%: %AUTHORS%
        </div>

        <div class="div_fahrplan_daten">
            <p style="text-align: center; margin-top: 64px;">Im Fahrplan wird die Seite<br/><br/>%INFOPAGE%<br/><br/>angefordert, 
            die ich aber auf diesem Computer nicht funden kann.
            </p>
        </div>
    </main>
</body>
</html>
